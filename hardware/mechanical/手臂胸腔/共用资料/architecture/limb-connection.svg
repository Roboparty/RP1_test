<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
<defs><marker id="power" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#cc6a16"/></marker><marker id="can" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#1672b9"/></marker><marker id="control" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#7350a4"/></marker><marker id="measure" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#138678"/></marker><marker id="safety" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#b24454"/></marker><marker id="ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#203246"/></marker></defs>
<rect width="1500" height="940" fill="#ffffff"/>
<text x="36" y="47" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="34" fill="#203246" font-weight="700">一条支路怎样接到带驱动器的机器人肢体</text>
<text x="36" y="84" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="22" fill="#516477" font-weight="400">柜端约定不是 OEM 针脚 · 不重复购买基础伺服驱动器 · 线束须防错插</text>
<rect x="30" y="160" width="330" height="150" rx="10" fill="#f4f7fb" stroke="#c1ccd9" stroke-width="2"/>
<text x="46" y="192" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#203246" font-weight="700">柜端动力接口 Xn</text>
<text x="46" y="224" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">项目约定 1：DC+</text>
<text x="46" y="253" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">项目约定 2：DC−</text>
<text x="46" y="282" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">核对插头/导线额定</text>
<rect x="30" y="390" width="330" height="150" rx="10" fill="#f4f7fb" stroke="#c1ccd9" stroke-width="2"/>
<text x="46" y="422" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#203246" font-weight="700">独立 CAN 网络</text>
<text x="46" y="454" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">项目约定 3：CAN-H</text>
<text x="46" y="483" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">项目约定 4：CAN-L</text>
<text x="46" y="512" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">终端/参考/屏蔽按手册</text>
<rect x="420" y="225" width="300" height="230" rx="10" fill="#f4f7fb" stroke="#c1ccd9" stroke-width="2"/>
<text x="436" y="257" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#203246" font-weight="700">OEM 转接线束 / 盒</text>
<text x="436" y="289" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">逐针映射与导通核对</text>
<text x="436" y="318" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">动力与信号可分连接器</text>
<text x="436" y="347" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">需要时加入局部保护</text>
<text x="436" y="376" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">不把四针口强套到总成</text>
<polyline points="360,245 420,245" fill="none" stroke="#cc6a16" stroke-width="3" stroke-linejoin="round" marker-end="url(#power)"/>
<polyline points="360,450 390,450 390,400 420,400" fill="none" stroke="#1672b9" stroke-width="3" stroke-linejoin="round" marker-end="url(#can)"/>
<rect x="780" y="145" width="690" height="510" rx="10" fill="#f1f8f5" stroke="#c1ccd9" stroke-width="2"/>
<text x="796" y="177" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#203246" font-weight="700">一个手臂 / 腿部总成</text>
<text x="800" y="209" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#203246" font-weight="400">内部布局与保护由厂家确认；整肢体汇总测量</text>
