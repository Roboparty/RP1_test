<text x="1271" y="374" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="20" fill="#203246" font-weight="400">编码器 / 电机</text>
<text x="1271" y="403" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="20" fill="#203246" font-weight="400">已集成在总成内</text>
<polyline points="1347,260 1347,310" fill="none" stroke="#cc6a16" stroke-width="3" stroke-linejoin="round" marker-end="url(#power)"/>
<polyline points="1347,432 1347,500" fill="none" stroke="#1672b9" stroke-width="3" stroke-linejoin="round"/>
<polyline points="720,400 750,400 750,500 1450,500" fill="none" stroke="#1672b9" stroke-width="3" stroke-linejoin="round"/>
<rect x="810" y="545" width="265" height="65" rx="10" fill="#eef6fc" stroke="#c1ccd9" stroke-width="2"/>
<text x="826" y="577" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="700">物理总线端点：终端</text>
<rect x="1160" y="545" width="280" height="65" rx="10" fill="#eef6fc" stroke="#c1ccd9" stroke-width="2"/>
<text x="1176" y="577" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="700">另一物理端点：终端</text>
<text x="810" y="642" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">图中三节点仅示例，不能逐节点都加 120 Ω。</text>
<rect x="30" y="710" width="690" height="120" rx="10" fill="#f4f7fb" stroke="#c1ccd9" stroke-width="2" stroke-dasharray="9 7"/>
<text x="46" y="742" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#203246" font-weight="700">条件性独立接口：不能从未知针脚推断</text>
<text x="46" y="774" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">PE、CAN 参考、屏蔽、逻辑供电、抱闸、温度等</text>
<text x="46" y="803" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">是否已集成与供电/接地方式按 OEM 手册确定</text>
<rect x="780" y="710" width="690" height="120" rx="10" fill="#f4f7fb" stroke="#b24454" stroke-width="2" stroke-dasharray="9 7"/>
<text x="796" y="742" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="23" fill="#b24454" font-weight="700">普通 Enable 与安全 STO 分开</text>
<text x="796" y="774" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">按风险设计安全停机、防重启及重力支撑</text>
<text x="796" y="803" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="21" fill="#203246" font-weight="400">无 STO 的设备需另评估安全停机方案</text>
