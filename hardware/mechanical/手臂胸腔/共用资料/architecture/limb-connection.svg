<text x="1056" y="374" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="20" fill="#203246" font-weight="400">编码器 / 电机</text>
<text x="1056" y="403" font-family="Microsoft YaHei, DengXian, sans-serif" font-size="20" fill="#203246" font-weight="400">已集成在总成内</text>
<polyline points="1132,260 1132,310" fill="none" stroke="#cc6a16" stroke-width="3" stroke-linejoin="round" marker-end="url(#power)"/>
<polyline points="1132,432 1132,500" fill="none" stroke="#1672b9" stroke-width="3" stroke-linejoin="round"/>
<rect x="1255" y="310" width="185" height="122" rx="10" fill="#f4f7fb" stroke="#c1ccd9" stroke-width="2"/>
