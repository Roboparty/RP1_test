[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp1-test-demo"
version = "0.1.0"
description = "Synthetic data and ingestion demonstration client for RP1 test tooling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["rp1-test>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=7.4", "ruff"]

[project.scripts]
rp1-demo = "rp1_demo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../test-runner/src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B904", "B905"]
