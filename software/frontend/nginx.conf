map $uri $rp1_cache_control {
    ~^/api/                         "no-store";
    ~^/(healthz|readyz)$            "no-store";
    ~^/assets/.*\.(js|css)$         "public, max-age=31536000, immutable";
    ~^/(assets|model-posters)/      "public, max-age=604800";
    default                         "no-cache";
}

server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls-cert;
    ssl_certificate_key /run/secrets/tls-key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=1s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    add_header Cache-Control $rp1_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { proxy_pass $api_upstream/healthz; }
    location = /readyz { proxy_pass $api_upstream/readyz; }
    location = /openapi.json { proxy_pass $api_upstream/openapi.json; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}
