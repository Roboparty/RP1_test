name: Reliability platform delivery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: software
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rp1_admin
          POSTGRES_PASSWORD: isolated-ci-admin
          POSTGRES_DB: rp1_presence_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rp1_admin -d rp1_presence_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: service:database:host
      ARCHIVE_ROOT: /tmp/rp1-ci-archives
      APP_ENV: test
      AUTH_MODE: session
      AUTH_COOKIE_SECURE: 'false'
      DATABASE_URL: postgresql+psycopg://rp1_app:isolated-ci-app@127.0.0.1:5432/rp1_presence_ci
      HMI_TEST_ADMIN_URL: postgresql+psycopg://rp1_admin:isolated-ci-admin@127.0.0.1:5432/rp1_presence_ci
      RP1_APP_USER: rp1_app
      RP1_APP_PASSWORD: isolated-ci-app
      RP1_READONLY_USER: rp1_readonly
      RP1_READONLY_PASSWORD: isolated-ci-reader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: software/frontend/package-lock.json
      - run: python -m pip install -r service/requirements-dev.txt -r database/requirements.txt -c service/requirements.lock jsonschema==4.26.0
      - run: sh database/docker-entrypoint-initdb.d/00-create-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: isolated-ci-admin
          POSTGRES_USER: rp1_admin
          POSTGRES_DB: rp1_presence_ci
      - working-directory: software/database
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://rp1_admin:isolated-ci-admin@127.0.0.1:5432/rp1_presence_ci
      - run: python -m pytest -c service/pytest.ini service/tests -m 'not integration' -q
      - run: python3 scripts/test-archive-deployment-guards.py
      - run: python -m pytest -c service/pytest.ini service/tests/test_hmi_presence_integration.py service/tests/test_setup_integration.py service/tests/test_submissions_integration.py service/tests/test_*archive*integration.py -q
      - working-directory: software/frontend
        run: npm ci && npm run check
      - run: python3 scripts/check-release.py
  hmi:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo bash scripts/install-build-deps-ubuntu24.sh
      - run: ./scripts/build-hmi.sh
      - run: docker build --build-arg HMI_VERSION="$(cat host/packaging/LOCAL_VERSION)" -f deployment/HmiAcceptance.Dockerfile -t rp1-hmi-acceptance .
      - run: docker run --rm --network none rp1-hmi-acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rp1-test-hmi-ubuntu24-amd64
          path: |
            software/host/dist/*.deb
            software/host/dist/*.sha256
          if-no-files-found: error
