name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            software
            data-analysis
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install -e './software/test-runner[test]' -e './software/demo-client[test]'
      - name: Test runner
        run: python -m pytest -q -p no:cacheprovider software/test-runner/tests
      - name: Test synthetic client in a separate process
        run: python -m pytest -q -p no:cacheprovider software/demo-client/tests
      - name: Test analysis and monitoring contracts
        run: |
          python -m unittest discover -s data-analysis/tests
          python -m unittest discover -s software/influxdb/tests
          python software/grafana/scripts/validate_dashboard.py
      - name: Run the documented offline analysis
        run: >-
          python data-analysis/scripts/analyze_run.py data-analysis/examples/synthetic-run
          --output outputs/analysis-demo --max-gap-s 1.5

  hmi:
    name: HMI / fake backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: software/host
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: software
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Install HMI test dependencies
        run: python -m pip install -e '.[desktop,test]' -c constraints-tested.txt
      - name: Test HMI without a robot
        run: python -m pytest -q -p no:cacheprovider tests

  stack:
    name: Data services / synthetic demo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: software
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Start services and run synthetic demo
        run: |
          sh scripts/start.sh
          python scripts/verify_stack.py --wait-seconds 60
          sh scripts/run-demo.sh
          python scripts/verify_stack.py --demo --wait-seconds 60
      - name: Test API and database contracts
        run: |
          docker compose run --rm --no-deps -v "$PWD/database:/database:ro" api python -m pytest -q
          docker compose run --rm --no-deps migrate python -m unittest discover -s tests
          docker compose run --rm migrate python scripts/verify_schema.py
      - name: Clean up temporary CI services
        if: always()
        run: docker compose --profile demo down --volumes --remove-orphans
